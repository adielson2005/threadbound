# Configuração do Claude Code Game Studios para o Fiapo.
# Veja .claude/docs/effects-map.md para o esquema completo.

schema_version: 1

framework:
  version: 1.2.0
  last_upgraded: 2026-11-04

project:
  name: "Fiapo"
  genre: "Aventura 3D de plataforma e luta"
  stage: Production          # o jogo já é jogável (capítulo 1, chefe, mapa das ilhas)
  kind: game

modes:
  rigor: minimal             # pouco processo: o GDD vive em docs/GDD.md
  automation: collaborative

platform:
  multiplayer: false
  online: false
  targets: [Web, Mobile]
  primary_input: "Teclado/Mouse e toque"
  gamepad_support: "None"
  touch_support: "Full"
  cert_tier: none

# Motor: o CCGS só aceita Godot|Unity|Unreal em engine.name, então o bloco fica de fora.
# O Fiapo usa um motor próprio: Three.js r165, JavaScript (módulos ES), WebGL 2,
# colisão com three-mesh-bvh (cápsula). Detalhes em CLAUDE.md e src/CLAUDE.md.

specialists:
  code: "gameplay-programmer"
  shader: "technical-artist"
  ui: "ui-programmer"
  additional: []

commands:
  run: "python3 -m http.server 8000"   # abra http://localhost:8000
  build: "bash ferramentas/gerar-apk.sh"
